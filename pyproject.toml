[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-webmcp-agent-network"
version = "1.0.0"
description = "Autonomous Multi-Agent Web Operator using WebMCP + Fetch.ai + ACP + ASI:One"
authors = [{ name = "Dynamic WebMCP Agent Network Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uagents>=0.23.6",
    "uagents-core>=0.4.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]
